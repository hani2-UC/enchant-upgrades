name: Build and GameTests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: forge, mc: '1.20.1', project: '.', java: '17', test: runGameTestServer }
          - { loader: fabric, mc: '1.20.1', project: fabric, java: '17', test: runGametest }
          - { loader: fabric, mc: '1.21.1', project: fabric-modern, java: '21', test: runGametest }
          - { loader: fabric, mc: '1.21.4', project: fabric-modern, java: '21', test: runGametest }
          - { loader: neoforge, mc: '1.21.1', project: neoforge, java: '21', test: runGameTestServer }
          - { loader: neoforge, mc: '1.21.4', project: neoforge, java: '21', test: runGameTestServer }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test in Minecraft
        shell: bash
        run: |
          wrapper="$GITHUB_WORKSPACE/gradlew"
          if [ '${{ matrix.project }}' = 'fabric-modern' ]; then
            wrapper="$GITHUB_WORKSPACE/fabric-modern/gradlew"
          fi
          cd '${{ matrix.project }}'
          bash "$wrapper" -PmcVersion=${{ matrix.mc }} build ${{ matrix.test }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: enchant-upgrades-${{ matrix.loader }}-${{ matrix.mc }}
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            ${{ matrix.project }}/build/${{ matrix.mc }}/libs/*.jar
