plugins { id 'fabric-loom' version '1.9.2' }
def variants = ['1.21.1': '0.116.17+1.21.1', '1.21.4': '0.119.4+1.21.4']
if (!variants.containsKey(mcVersion)) throw new GradleException('Supported versions: ' + variants.keySet())
version = mod_version
group = 'jp.hani.enchantupgrades'
base.archivesName = "enchant_upgrades-fabric-${mcVersion}"
layout.buildDirectory = file("build/${mcVersion}")
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${variants[mcVersion]}"
}
sourceSets {
    main {
        java.srcDir '../common-mc21/src/main/java'
        resources.srcDir '../common-mc21/src/main/resources'
    }
    testmod {
        java.srcDir '../common-mc21/src/test/java'
        java.srcDir "../common-mc21/src/test/${mcVersion}/java"
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}
tasks.register('generateResources', Copy) {
    from('../src/main/resources/assets') { into 'assets' }
    from('../src/main/resources/data/enchant_upgrades/recipes') {
        exclude 'sweeping.json'
        into 'data/enchant_upgrades/enchantment_upgrades'
    }
    into layout.buildDirectory.dir('generated/resources')
}
sourceSets.main.resources.srcDir tasks.named('generateResources')
loom {
    mods {
        enchant_upgrades { sourceSet sourceSets.main }
        enchant_upgrades_test { sourceSet sourceSets.testmod }
    }
    runs {
        gametest {
            server()
            source sourceSets.testmod
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest.xml"
            runDir "build/${mcVersion}/gametest"
        }
        smokeClient {
            client()
            source sourceSets.testmod
            vmArg '-Denchant_upgrades.smoke=true'
            programArgs '--width', '1100', '--height', '760'
            runDir "build/${mcVersion}/smoke-client"
        }
    }
}
processResources {
    dependsOn tasks.named('generateResources')
    inputs.properties version: project.version, minecraft: mcVersion, api: variants[mcVersion]
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: mcVersion, api: variants[mcVersion] }
    filesMatching('pack.mcmeta') { expand pack_format: mcVersion == '1.21.4' ? 46 : 34 }
}
jar { from('../LICENSE.md') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
